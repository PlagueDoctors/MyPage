<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blue Toaster</title>
    <meta name="description" content="Blue Toaster — 滚轮驱动的粒子空间体验，四章穿越。" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#01020a" />
  </head>
  <body>
    <!-- WebGL 画布。pointer-events: none —— 指针事件全部交给下面的文档 -->
    <canvas id="stage" aria-hidden="true"></canvas>

    <!-- 只负责撑出滚动高度。体验模式下高度 = 章节数 × 135vh -->
    <div class="scroll-track" aria-hidden="true"></div>

    <!-- 章节文案由 chapters.config.ts 渲染进来，HTML 里不再硬编码任何正文 -->
    <main class="chapters" id="chapters"></main>

    <div id="orbit"></div>
    <div id="instrument"></div>
    <p id="hint">向下滚动</p>
    <a class="corner-link" href="./test.html">Code Rain →</a>

    <div id="preloader"></div>

    <noscript>
      <p class="noscript-note">已启用纯文本版本 · 开启 JavaScript 可进入粒子空间体验</p>
      <section class="noscript-fallback">
        <h1>Blue Toaster</h1>
        <p>
          这是一个滚轮驱动的 3D 粒子体验站点，正文由 JavaScript 渲染。当前浏览器未执行脚本，
          所以这里显示的是精简说明。
        </p>
        <p>
          开启 JavaScript 后可以看到：粒子场在滚动中聚合为形状的完整四章叙事，带实时景深虚化、
          相机飞行路径与叙事化里程读数。
        </p>
      </section>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
