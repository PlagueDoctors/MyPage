name: Deploy to GitHub Pages

# 这个工作流存在的唯一理由：本项目的 index.html 是 Vite 的**源码入口**
# （引用了 /src/main.ts），不能被当成静态页面直接发布。
# 必须先在 CI 里构建成 dist/，再把 dist/ 作为站点产物上传。
#
# ⚠️ 首次启用需要在仓库里做一次设置（只需一次）：
#    Settings → Pages → Build and deployment → Source 选 **GitHub Actions**
# 如果 Source 仍然是 "Deploy from a branch: main / (root)"，
# GitHub 会继续发布源码目录，页面就是一张黑屏。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只保留一次部署；新的推送取消上一次未完成的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 类型检查作为门禁：配置写错了（区间断裂、末章误设 fadeOut 等）
      # 在这里就该断掉，而不是部署上去才发现
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 冒烟测试：deploy-pages 报告成功，并不等于线上真的在服务构建产物。
      #
      # 两个必须处理的坑（都真实踩过）：
      #  1. Source 仍是 legacy 时，GitHub 会并行跑一条 pages build and deployment，
      #     而它可能在 deploy-pages 之后才落地、把站点覆盖回源码目录。
      #     所以必须先静置再检查，否则会在它覆盖之前误判为成功。
      #  2. page_url 不带尾斜杠，拼上 ?cb= 会触发 301，curl 必须加 -L 跟随。
      - name: Smoke test — 确认线上服务的确实是构建产物
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          echo "目标：$PAGE_URL"
          echo "静置 45 秒，等并发的 legacy 构建（若存在）先落地…"
          sleep 45

          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL "${PAGE_URL}?cb=${RANDOM}${RANDOM}" || true)"

            if printf '%s' "$html" | grep -q '/src/main\.ts'; then
              echo "第 ${attempt} 次：线上仍在服务仓库源码目录"
            elif printf '%s' "$html" | grep -q 'assets/index-'; then
              echo "第 ${attempt} 次：线上已服务构建产物 ✅"
              exit 0
            else
              echo "第 ${attempt} 次：内容不符预期（取到 ${#html} 字节）"
            fi

            sleep 20
          done

          echo "::error title=Pages 没有在服务构建产物::线上仍是仓库源码目录。请到 Settings → Pages → Build and deployment → Source，把来源改为「GitHub Actions」，然后重新运行本工作流。判断依据：只要 Actions 列表里还能看到 pages build and deployment 被触发，就说明 Source 仍是 legacy。"
          exit 1
